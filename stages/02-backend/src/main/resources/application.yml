server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: smartpool-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smartpool}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:smartpool}
    password: ${MYSQL_PASSWORD:smartpool}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

smartpool:
  jwt:
    secret: ${JWT_SECRET:smartpool-demo-secret-key-change-me-32bytes}
    expire-seconds: 43200
  simulator:
    base-url: ${SIMULATOR_URL:http://localhost:8010}
  ai:
    base-url: ${AI_URL:http://localhost:8000}
  live:
    push-interval-ms: ${LIVE_PUSH_INTERVAL_MS:100}
    redis-cache-ms: ${LIVE_REDIS_CACHE_MS:1000}
    snapshot-ttl-seconds: 30

logging:
  level:
    root: info
    com.smartpool: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] %-5level %logger{36} - %msg%n"
